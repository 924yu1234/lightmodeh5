<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%; transform: scale(1.4) translateX(-8%);">
            <defs>
              <linearGradient id="flowGlow" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0%" stop-color="rgba(0,160,255,0)"></stop>
                <stop offset="100%" stop-color="#00A0FF"></stop>
              </linearGradient>
              <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
              </filter>
            </defs>
            <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
              <line x1="0" y1="100" x2="300" y2="100"></line>
              <line x1="70" y1="0" x2="70" y2="200"></line>
            </g>
            <path d="M 240 140 L 160 100 L 70 100" fill="none" class="link-layer" stroke="rgba(255,255,255,0.1)" stroke-width="2"></path>
            <path d="M 240 60 L 160 100" fill="none" class="link-layer" stroke="rgba(255,255,255,0.1)" stroke-width="2"></path>
            <path d="M 240 140 L 160 100 L 70 100" fill="none" class="flow-line link-layer" stroke="url(#flowGlow)" stroke-width="2" stroke-linecap="round"></path>
            <path d="M 240 60 L 160 100" fill="none" class="flow-line link-layer" stroke="url(#flowGlow)" stroke-width="2" stroke-linecap="round"></path>
            
            <g filter="url(#nodeGlow)">
              <rect x="54" y="84" width="32" height="32" rx="4" fill="#13132F" stroke="#00A0FF" stroke-width="1.5">
                <animateTransform attributeName="transform" type="rotate" from="0 70 100" to="360 70 100" dur="20s" repeatCount="indefinite"></animateTransform>
              </rect>
              <rect x="60" y="90" width="20" height="20" rx="3" fill="none" stroke="rgba(0,160,255,0.5)" stroke-width="1">
                <animateTransform attributeName="transform" type="rotate" from="45 70 100" to="-315 70 100" dur="10s" repeatCount="indefinite"></animateTransform>
              </rect>
              <circle cx="70" cy="100" r="4" fill="#00A0FF">
                <animate attributeName="r" values="3.5;5;3.5" dur="3s" repeatCount="indefinite"></animate>
              </circle>
            </g>
            
            <rect x="150" y="90" width="20" height="20" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.3)" stroke-width="1"></rect>
            <text x="160" y="125" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">LVL_1</text>
            <text x="160" y="78" fill="#00A0FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">+ 30%</text>
            
            <rect x="230" y="50" width="16" height="16" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.15)" stroke-width="1"></rect>
            <text x="260" y="60" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="start">LVL_2</text>
            <text x="260" y="50" fill="rgba(0,160,255,0.8)" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="start">+ 15%</text>
            
            <rect x="230" y="132" width="16" height="16" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.15)" stroke-width="1"></rect>
            <text x="260" y="142" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="start">LVL_2</text>
          </svg>